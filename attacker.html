<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Attacker Dashboard</title>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: sans-serif; display: flex; height: 100vh; }
        #viewer { flex: 2; display: flex; justify-content: center; align-items: center; background: #222; }
        #stream-screen { max-width: 100%; max-height: 90vh; border: 1px solid #444; }
        #logs { flex: 1; padding: 20px; background: #1a1a1a; border-left: 1px solid #333; overflow-y: auto; }
        .log-item { font-size: 13px; color: #00ffcc; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div id="viewer">
        <img id="stream-screen" alt="Attacker View">
    </div>
    <div id="logs">
        <h3>실시간 피해자 세션 모니터링</h3>
        <div id="log-box"></div>
    </div>

    <script>
        // 123번 세션으로 공격자 대시보드 웹소켓 연결
        const ws = new WebSocket('ws://localhost:8080/attacker?session=123');
        const screenImg = document.getElementById('stream-screen');
        const logBox = document.getElementById('log-box');

        ws.onmessage = function(event) {
            const msg = JSON.parse(event.data);
            if (msg.type === 'frame') {
                screenImg.src = 'data:image/png;base64,' + msg.data;
            } else if (msg.type === 'log') {
                const div = document.createElement('div');
                div.className = 'log-item';
                div.innerText = `> ${msg.content}`;
                logBox.appendChild(div);
                logBox.scrollTop = logBox.scrollHeight;
            }
        };
    </script>
</body>
</html>
